[package]
name = "signalytics"
version = "0.2.0"
edition = "2024"

[dependencies]
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio", "tls-rustls"] }
anyhow = "1.0.100"
syslog_loose = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
blake3 = "1.8.7"
sha1 = "0.11.0"
base64 = "0.23.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
