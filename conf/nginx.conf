events {
}

http {
    log_format signalytics escape=json
        '{'
            '"tls_client_ciphers_sha1":"$http_x_tls_client_ciphers_sha1"'
         '}';

    server {
        access_log syslog:server=signalytics:9000 signalytics;

        location / {
            return 200 'ok';
        }
    }
}
